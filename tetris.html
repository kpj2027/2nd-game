<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Tetris</title>
<style>
  body {
    margin: 0;
    background: #1a1a2e;
    color: #eee;
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }
  .wrap {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  canvas {
    background: #000;
    border: 2px solid #444;
    display: block;
  }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 140px;
  }
  .box {
    background: #16213e;
    padding: 10px 14px;
    border-radius: 6px;
  }
  .box h3 {
    margin: 0 0 6px;
    font-size: 13px;
    color: #8ab4f8;
    letter-spacing: 1px;
  }
  .box .v {
    font-size: 22px;
    font-weight: bold;
  }
  .controls {
    font-size: 12px;
    line-height: 1.7;
    color: #bbb;
  }
  button {
    padding: 8px;
    background: #0f3460;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #16498c; }
  #overlay {
    position: absolute;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 20px 30px;
    border-radius: 8px;
    font-size: 20px;
    display: none;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div style="position:relative">
    <canvas id="board" width="240" height="480"></canvas>
    <div id="overlay"></div>
  </div>
  <div class="panel">
    <div class="box"><h3>SCORE</h3><div class="v" id="score">0</div></div>
    <div class="box"><h3>LINES</h3><div class="v" id="lines">0</div></div>
    <div class="box"><h3>LEVEL</h3><div class="v" id="level">1</div></div>
    <div class="box"><h3>NEXT</h3><canvas id="next" width="96" height="96"></canvas></div>
    <button id="startBtn">시작 / 재시작</button>
    <div class="box controls">
      ← → 이동<br>
      ↑ 회전<br>
      ↓ 소프트 드롭<br>
      Space 하드 드롭<br>
      P 일시정지
    </div>
  </div>
</div>
<script>
const COLS = 10, ROWS = 20, SIZE = 24;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nctx = nextCanvas.getContext('2d');
const overlay = document.getElementById('overlay');

const COLORS = [null, '#00f0f0', '#0000f0', '#f0a000', '#f0f000', '#00f000', '#a000f0', '#f00000'];
const SHAPES = [
  [],
  [[1,1,1,1]],
  [[2,0,0],[2,2,2]],
  [[0,0,3],[3,3,3]],
  [[4,4],[4,4]],
  [[0,5,5],[5,5,0]],
  [[0,6,0],[6,6,6]],
  [[7,7,0],[0,7,7]],
];

let board, piece, next, score, lines, level, dropInterval, dropCounter, lastTime, paused, over;

function newBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(0));
}

function randomPiece() {
  const id = Math.floor(Math.random() * 7) + 1;
  const shape = SHAPES[id].map(r => r.slice());
  return { shape, x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
}

function collide(b, p) {
  for (let y = 0; y < p.shape.length; y++) {
    for (let x = 0; x < p.shape[y].length; x++) {
      if (!p.shape[y][x]) continue;
      const ny = p.y + y, nx = p.x + x;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && b[ny][nx]) return true;
    }
  }
  return false;
}

function merge(b, p) {
  p.shape.forEach((row, y) => row.forEach((v, x) => {
    if (v) b[p.y + y][p.x + x] = v;
  }));
}

function rotate(shape) {
  const h = shape.length, w = shape[0].length;
  const res = Array.from({length: w}, () => Array(h).fill(0));
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++)
      res[x][h - 1 - y] = shape[y][x];
  return res;
}

function tryRotate() {
  const old = piece.shape;
  piece.shape = rotate(piece.shape);
  let kick = 0;
  while (collide(board, piece)) {
    kick = kick >= 0 ? -(kick + 1) : -kick;
    piece.x += kick;
    if (Math.abs(kick) > 2) { piece.shape = old; piece.x -= kick; return; }
  }
}

function clearLines() {
  let cleared = 0;
  outer: for (let y = ROWS - 1; y >= 0; y--) {
    for (let x = 0; x < COLS; x++) if (!board[y][x]) continue outer;
    board.splice(y, 1);
    board.unshift(Array(COLS).fill(0));
    cleared++;
    y++;
  }
  if (cleared) {
    const pts = [0, 100, 300, 500, 800][cleared] * level;
    score += pts;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(100, 1000 - (level - 1) * 80);
    updateUI();
  }
}

function drop() {
  piece.y++;
  if (collide(board, piece)) {
    piece.y--;
    merge(board, piece);
    clearLines();
    piece = next;
    next = randomPiece();
    drawNext();
    if (collide(board, piece)) gameOver();
  }
  dropCounter = 0;
}

function hardDrop() {
  while (!collide(board, piece)) piece.y++;
  piece.y--;
  score += 2;
  drop();
}

function move(dir) {
  piece.x += dir;
  if (collide(board, piece)) piece.x -= dir;
}

function drawCell(c, x, y, v, cell = SIZE) {
  c.fillStyle = COLORS[v];
  c.fillRect(x * cell, y * cell, cell, cell);
  c.strokeStyle = 'rgba(0,0,0,0.3)';
  c.strokeRect(x * cell, y * cell, cell, cell);
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (board[y][x]) drawCell(ctx, x, y, board[y][x]);
  if (piece) {
    piece.shape.forEach((row, y) => row.forEach((v, x) => {
      if (v && piece.y + y >= 0) drawCell(ctx, piece.x + x, piece.y + y, v);
    }));
  }
}

function drawNext() {
  nctx.fillStyle = '#000';
  nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  const s = next.shape;
  const cell = 20;
  const ox = (nextCanvas.width - s[0].length * cell) / 2 / cell;
  const oy = (nextCanvas.height - s.length * cell) / 2 / cell;
  s.forEach((row, y) => row.forEach((v, x) => {
    if (v) drawCell(nctx, x + ox, y + oy, v, cell);
  }));
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('lines').textContent = lines;
  document.getElementById('level').textContent = level;
}

function gameOver() {
  over = true;
  overlay.textContent = 'GAME OVER';
  overlay.style.display = 'block';
  positionOverlay();
}

function positionOverlay() {
  overlay.style.left = (canvas.offsetLeft + canvas.width / 2 - overlay.offsetWidth / 2) + 'px';
  overlay.style.top = (canvas.offsetTop + canvas.height / 2 - overlay.offsetHeight / 2) + 'px';
}

function loop(time = 0) {
  if (over) return;
  const delta = time - lastTime;
  lastTime = time;
  if (!paused) {
    dropCounter += delta;
    if (dropCounter > dropInterval) drop();
    draw();
  }
  requestAnimationFrame(loop);
}

function start() {
  board = newBoard();
  piece = randomPiece();
  next = randomPiece();
  score = 0; lines = 0; level = 1;
  dropInterval = 1000; dropCounter = 0; lastTime = 0;
  paused = false; over = false;
  overlay.style.display = 'none';
  updateUI();
  drawNext();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if (over) return;
  if (e.key === 'p' || e.key === 'P') {
    paused = !paused;
    overlay.textContent = 'PAUSED';
    overlay.style.display = paused ? 'block' : 'none';
    if (paused) positionOverlay();
    return;
  }
  if (paused) return;
  if (e.key === 'ArrowLeft') move(-1);
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowDown') { drop(); score += 1; updateUI(); }
  else if (e.key === 'ArrowUp') tryRotate();
  else if (e.key === ' ') { e.preventDefault(); hardDrop(); updateUI(); }
  draw();
});

document.getElementById('startBtn').addEventListener('click', start);
start();
</script>
</body>
</html>
